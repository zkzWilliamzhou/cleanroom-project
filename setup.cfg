[metadata]
name = cleanroom
version = 1.0.0
description = Prove whether a command works on a machine that has never seen your laptop
url = https://github.com/cleanroom/cleanroom
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
keywords = ci, reproducibility, developer-tools, hidden-state, clean-room
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    License :: OSI Approved :: MIT License
    Operating System :: POSIX
    Topic :: Software Development :: Quality Assurance

[options]
packages = cleanroom
python_requires = >=3.10
include_package_data = False

[options.entry_points]
console_scripts =
    cleanroom = cleanroom.cli:main
